# Example pixel OSD layout - positions are PIXELS on a 1920x1080 canvas.
# Widgets are drawn in file order, so later sections overlap earlier ones.
# Reload is cheap: edit, re-render in the host preview, look. No camera needed.

[osd]
# JetBrains Mono Bold (OFL 1.1): monospace so figures are tabular and a changing
# value cannot shuffle sideways, dotted zero to separate it from O, and a bold
# weight because the I4 palette leaves the rasteriser only a body and an edge
# colour - thin stems quantise away over moving video.
# Subset to the glyphs an OSD can display: 8 KiB instead of 274 KiB, which on a
# camera with under a megabyte of free overlay is the difference between fitting
# and not. Rendering is bit-identical (see tools/subset_font.sh).
font = /usr/share/fonts/truetype/UAV-OSD-Mono-osd.ttf

# Global geometry multiplier for every position, size and thickness (value
# ranges are data and are not touched). Positions here are pixels, and the
# overlay canvas is whatever the encoder is set to - so without this the same
# file would draw a 1080p-sized OSD in the corner of a 4K stream.
#   auto      derive it from the canvas height against 1080 (one file, any
#             stream resolution: 1.0 at 1080p, 2.0 at 2160p)
#   <number>  fix it yourself, 0.1 .. 8
scale = auto

# --- top status row -----------------------------------------------------------

[mode]
type   = text
x      = 40
y      = 56
size   = 34
source = mode
format = %s

[voltage]
type   = text
x      = 960
y      = 56
size   = 34
align  = center
source = volt
format = %.1fV

[link]
type   = text
x      = 1880
y      = 56
size   = 34
align  = right
source = lq
format = LQ %.0f%%

# --- left column --------------------------------------------------------------

[altitude]
type   = text
x      = 40
y      = 480
size   = 40
source = alt
format = %.0fm

[speed]
type   = text
x      = 40
y      = 540
size   = 40
source = spd
format = %.0fkph

[sats]
type   = text
x      = 40
y      = 596
size   = 26
color  = cyan
source = sats
format = SAT %.0f

# --- centre: artificial horizon at the real roll and pitch --------------------

[horizon]
type      = horizon
x         = 960
y         = 520
w         = 840
pitch_scale = 8
thickness = 3
color     = white

# --- bottom: battery bar and throttle dial -----------------------------------

[batt_bar]
type   = bar
x      = 40
y      = 980
w      = 320
h      = 22
source = batt
min    = 0
max    = 100
color  = green
edge   = white
label  = BATT

[throttle]
type   = gauge
x      = 1760
y      = 940
size   = 80
source = throttle
min    = 0
max    = 100
color  = red
edge   = graylight
label  = THR

# --- home pointer -------------------------------------------------------------

[home]
type   = arrow
x      = 1500
y      = 940
size   = 52
source = home_bearing
color  = yellow
edge   = black

[home_dist]
type   = text
x      = 1500
y      = 1020
size   = 26
align  = center
source = home_dist
format = %.0fm

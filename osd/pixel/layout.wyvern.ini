# Wyvern Link - the OSD this aircraft flies with, rebuilt as pixel widgets, plus
# the instruments a character grid cannot draw.
#
# What the stock OSD showed as three lines of text at the top:
#   LQ:66% | MCS:5 | 13000kbps | 13.6Mb FPS:91 | CPU:46%,57c | TX:39c
#   [#########......] [66%] uplink
#   pw:1450 | Ch:165-20mhz | q:1745,shift:0.0
# is kept - it is the link data that matters in the air - but each figure is its
# own widget, so link quality is always in the same place and temperature is not
# buried mid-sentence. The uplink bar becomes a real bar instead of ASCII hashes.

[osd]
font  = /usr/share/fonts/truetype/UAV-OSD-Mono-osd.ttf
scale = auto
# Visible layers at boot, and the RC channel that switches between them: a
# three-position switch shows layer 0, 1 or 2. Layers are a different idea from
# z - z decides what is in front, layers decide what is shown at all.
layers = 0
layer_channel = 0

# --- datalink block, top left (green, as it was) -------------------------------

[dl_lq]
type   = text
x      = 30
y      = 40
size   = 26
color  = green
source = dl_lq
format = LQ %.0f%%

[dl_mcs]
type   = text
x      = 190
y      = 40
size   = 26
color  = green
source = dl_mcs
format = MCS %.0f

[dl_bitrate]
type   = text
x      = 330
y      = 40
size   = 26
color  = green
source = dl_bitrate
format = %.0fk

[dl_mbps]
type   = text
x      = 480
y      = 40
size   = 26
color  = green
source = dl_mbps
format = %.1fMb

[dl_fps]
type   = text
x      = 620
y      = 40
size   = 26
color  = green
source = dl_fps
format = %.0ffps

# The ASCII bar was [#########......]; a real bar reads faster and takes less room
[uplink_bar]
type   = bar
x      = 30
y      = 58
w      = 210
h      = 12
min    = 0
max    = 100
source = dl_uplink
color  = green
edge   = graydark

[uplink_pct]
type   = text
x      = 252
y      = 70
size   = 22
color  = green
source = dl_uplink
format = %.0f%% UP

# Third line: radio state
[radio]
type   = text
x      = 400
y      = 70
size   = 22
color  = graylight
source = dl_pw
format = PW %.0f

[channel]
type   = text
x      = 520
y      = 70
size   = 22
color  = graylight
source = dl_ch
format = CH %.0f

[bandwidth]
type   = text
x      = 630
y      = 70
size   = 22
color  = graylight
source = dl_bw
format = %.0fMHZ

# Thermals get the right edge to themselves: throttling is the failure this
# camera actually hits.
[cpu]
type   = text
x      = 1620
y      = 40
size   = 26
color  = green
source = dl_cpu
format = CPU %.0f%%

[soc_temp]
type   = text
x      = 1890
y      = 40
size   = 26
align  = right
color  = green
source = dl_soc_temp
format = SOC %.0f°C

[tx_temp]
type   = text
x      = 1890
y      = 70
size   = 22
align  = right
color  = green
source = dl_tx_temp
format = TX %.0f°C

# --- heading, top centre ---------------------------------------------------------
# Degrees above a pointer aiming down at the ribbon; all eight winds named.

[compass]
type   = compass
x      = 960
y      = 150
w      = 560
span   = 120
step   = 15
size   = 22
color  = white
accent = red

# Below the heading block: flight mode on the left, arm state on the right.

[mode]
type   = text
x      = 820
y      = 235
size   = 28
align  = right
source = mode
format = %s

[armed]
type   = text
x      = 1100
y      = 235
size   = 28
color  = red
source = armed
format = %s

# Home distance between them, house icon, metres until kilometres read better.

[home_dist]
type   = text
x      = 960
y      = 235
size   = 28
align  = center
icon   = home
source = home_auto
format = %s

# Warnings under the mode/home/armed row - RSNR LOW and friends.

[warning]
type   = text
x      = 960
y      = 300
size   = 28
align  = center
color  = red
source = msg
format = %s

# The icon carries its own RSSI word (drawn inside the cell); 30 px so that
# word stays legible. Percent of MSP_ANALOG's 0..1023 scale - link quality,
# not dBm.
[rssi]
type   = text
x      = 30
y      = 250
size   = 30
color  = green
icon   = rssi
source = rssi
format = %.0f%%

# --- speed tape, left ----------------------------------------------------------

[spd_tape]
type   = tape
x      = 250
y      = 390
h      = 300
span   = 40
step   = 5
size   = 20
align  = left
color  = white
accent = white
source = spd

[spd_unit]
type   = text
x      = 250
y      = 716
size   = 20
align  = center
color  = graylight
format = KPH

# --- altitude tape, right ------------------------------------------------------

[alt_tape]
type   = tape
x      = 1670
y      = 390
h      = 300
span   = 60
step   = 10
size   = 20
align  = right
color  = white
accent = white
source = alt

[alt_unit]
type   = text
x      = 1670
y      = 716
size   = 20
align  = center
color  = graylight
format = M

# Vario, right of the altitude tape's unit: stacked climb/descend arrows
# (green up, red down - the wrong-direction one disappears in flight) with
# the rate beside them. The arrow carries the sign, the number is absolute.
[vario]
type   = vario
x      = 1700
y      = 712
size   = 20
color  = white
source = vspd

# --- attitude, centre ----------------------------------------------------------

[ladder]
# z below zero: the attitude reference belongs behind the readouts, so numbers
# stay legible when the ladder sweeps under them.
z           = -10
type        = ladder
x           = 960
y           = 540
w           = 400
h           = 330
pitch_scale = 8
step        = 10
size        = 20
color       = white
accent      = white

[crosshair]
z      = -5
type   = crosshair
x      = 960
y      = 540
size   = 34
color  = yellow

# --- bottom left: position -------------------------------------------------------
# Icons instead of labels: a house is read before "HOME" is.

[sats]
type   = text
x      = 30
y      = 890
size   = 24
color  = cyan
icon   = sat
source = sats
format = %.0f

# Distance travelled since boot (integrated from ground speed air-side -
# MSP carries no trip field). Metres, then kilometres past 1000.
[trip]
type   = text
x      = 140
y      = 890
size   = 24
color  = cyan
icon   = trip
source = trip_auto
format = %s

[lat]
type   = text
x      = 30
y      = 930
size   = 22
color  = white
icon   = lat
source = lat
format = %s LAT

[lon]
type   = text
x      = 30
y      = 970
size   = 22
color  = white
icon   = lon
source = lon
format = %s LON


# --- bottom centre: battery ------------------------------------------------------
# Per-cell voltage: 3.5 means the same thing on 3S and on 6S, the pack total
# does not. Battery icon carries the "what", the bar carries the "how much".

[volt]
type   = text
x      = 960
y      = 950
size   = 40
align  = center
icon   = batt
source = cell_volt
format = %.2fV

[batt_bar]
type   = bar
x      = 810
y      = 970
w      = 300
h      = 18
min    = 0
max    = 100
source = batt
color  = green
edge   = white

[current]
type   = text
x      = 810
y      = 1030
size   = 26
color  = graylight
source = curr
format = %.2fA

[mah]
type   = text
x      = 1110
y      = 1030
size   = 26
align  = right
color  = graylight
source = mah
format = %.0fMAH

# --- home vector, centre -----------------------------------------------------
# Small arrow above the reticle pointing where home is, relative to the nose -
# in front of the ladder (z 0 vs -10) but visually part of the same group.

[home_vec]
type   = arrow
x      = 960
y      = 470
size   = 22
source = home_bearing
color  = white
edge   = black
